<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Place Only We Know</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&family=DM+Mono:wght@300&family=Caveat:wght@400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="loader" id="loader"><span data-i18n="title">A Place Only We Know</span></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a href="#home" class="logo" data-go="home" data-i18n="title">A Place Only We Know</a>
  <nav id="menu"></nav>
  <div class="nav-tools">
    <button class="lang" id="langBtn" type="button">العربية</button>
    <button class="burger" id="burger" type="button" aria-label="Menu" data-i18n-aria="menu" aria-expanded="false"><i></i><i></i></button>
  </div>
</header>

<main>
  <section id="home" class="dark hero">
    <p class="mono" data-i18n="home.mono">A little world made for you and me</p>
    <h1><span data-i18n="home.h1a">A Place</span><br><span data-i18n="home.h1b">Only We Know</span></h1>
    <p class="sub" data-i18n="home.sub">Somewhere between two souls, a story began.</p>
    <a href="#story" class="btn" data-go="story" data-i18n="home.btn">Enter Our World →</a>
    <p class="counter mono" id="counter" hidden></p>
  </section>

  <section id="story" class="light">
    <div class="wrap">
      <h2 data-i18n="story.h"></h2>
      <p class="sub" data-i18n="story.sub"></p>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>

  <section id="memories" class="wine">
    <div class="wrap wide">
      <h2 data-i18n="memories.h"></h2>
      <p class="sub" data-i18n="memories.sub"></p>
      <div class="board" id="board"></div>
      <p class="mono center" data-i18n="memories.foot"></p>
    </div>
  </section>

  <section id="love" class="light">
    <div class="wrap wide">
      <h2 data-i18n="love.h"></h2>
      <p class="sub" data-i18n="love.sub"></p>
      <div class="love-grid" id="loveGrid"></div>
      <div class="everyday" id="everyday"></div>
    </div>
  </section>

  <section id="quiz" class="dark">
    <div class="wrap quiz-wrap">
      <h2 data-i18n="quiz.h"></h2>
      <p class="sub" data-i18n="quiz.sub"></p>
      <div class="quiz" id="quizBox" aria-live="polite"></div>
    </div>
  </section>

  <section id="someday" class="wine">
    <div class="wrap wide">
      <h2 data-i18n="someday.h"></h2>
      <p class="sub" data-i18n="someday.sub"></p>
      <div class="progress" id="dreamProgress">
        <div class="bar"><i id="dreamBar"></i></div>
        <p class="mono" id="dreamCount"></p>
      </div>
      <div class="dreams" id="dreams"></div>
    </div>
  </section>

  <section id="letter" class="dark">
    <div class="wrap letter-wrap">
      <h2 data-i18n="letter.h"></h2>
      <p class="sub" data-i18n="letter.sub" id="letterSub"></p>
      <div class="envelope-stage" id="envStage">
        <button class="envelope" id="envelope" type="button" aria-label="Open the letter" data-i18n-aria="letter.open">
          <span class="env-back"></span>
          <span class="env-paper"></span>
          <span class="env-front"></span>
          <span class="env-flap"></span>
          <span class="env-seal">♡</span>
        </button>
      </div>
      <article class="paper" id="paper" hidden dir="ltr" lang="en">
        <div class="paper-text" id="paperText" aria-live="off"></div>
        <button class="skip mono" id="skipLetter" type="button" data-i18n="letter.skip"></button>
      </article>
      <button class="secret-door" id="secretDoor" type="button" hidden aria-label="Secret" data-i18n-aria="letter.secret">♡</button>
    </div>
  </section>

  <section id="end" class="end">
    <svg class="scene" id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Two people sitting under the stars" data-i18n-aria="end.scene">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0c0708"/><stop offset=".55" stop-color="#2a0f11"/><stop offset="1" stop-color="#642D32"/>
        </linearGradient>
        <radialGradient id="glow" cx=".5" cy="1" r=".7">
          <stop offset="0" stop-color="#d8cbb9" stop-opacity=".28"/><stop offset="1" stop-color="#d8cbb9" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="1200" height="700" fill="url(#sky)"/>
      <g id="sceneStars"></g>
      <rect width="1200" height="700" fill="url(#glow)"/>
      <path d="M0 520 L110 430 L190 490 L320 360 L430 470 L520 410 L640 500 L760 380 L880 480 L990 400 L1100 470 L1200 420 L1200 700 L0 700Z" fill="#1d0b0d"/>
      <path d="M0 590 L140 520 L260 575 L400 500 L540 585 L700 515 L850 590 L1000 530 L1130 585 L1200 555 L1200 700 L0 700Z" fill="#0f0607"/>
      <g fill="#050304">
        <!-- person 1 -->
        <circle cx="560" cy="505" r="17"/>
        <path d="M545 524 Q560 518 575 524 L582 580 L618 592 L618 602 L545 600 Q538 560 545 524Z"/>
        <!-- person 2 -->
        <circle cx="628" cy="512" r="15"/>
        <path d="M614 528 Q628 523 642 528 L650 584 L676 594 L676 602 L606 602 Q604 560 614 528Z"/>
        <path d="M0 600 L1200 600 L1200 700 L0 700Z"/>
      </g>
    </svg>
    <div class="end-copy">
      <p class="end-text" id="endText" dir="ltr" lang="en"></p>
      <button class="btn" id="toBeginning" type="button" data-i18n="end.btn"></button>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Close" data-i18n-aria="close">×</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous" data-i18n-aria="prev">‹</button>
  <figure>
    <div class="lb-img" id="lbImg"></div>
    <figcaption><span id="lbCap"></span><small class="lb-text" id="lbText"></small><small class="mono" id="lbDate"></small></figcaption>
  </figure>
  <button class="lb-nav next" id="lbNext" aria-label="Next" data-i18n-aria="nextA">›</button>
</div>

<div class="modal" id="dreamModal" hidden role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-x" id="dreamX" type="button" aria-label="Close" data-i18n-aria="close">×</button>
    <div class="modal-img" id="dreamImg"></div>
    <div class="modal-body">
      <h3 id="dreamTitle"></h3>
      <p id="dreamText"></p>
      <button class="btn small" id="dreamMark" type="button"></button>
    </div>
  </div>
</div>

<div class="modal secret-modal" id="secretModal" hidden role="dialog" aria-modal="true">
  <div class="modal-card secret-card">
    <button class="modal-x" id="secretX" type="button" aria-label="Close" data-i18n-aria="close">×</button>
    <div id="secretGate" class="gate">
      <h3 data-i18n="secret.h"></h3>
      <p data-i18n="secret.sub"></p>
      <form id="secretForm" autocomplete="off">
        <input id="secretInput" type="password" data-i18n-ph="secret.ph" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="auto">
        <button class="btn small" type="submit" data-i18n="secret.go"></button>
      </form>
      <p class="err" id="secretErr" hidden data-i18n="secret.bad"></p>
    </div>
    <div id="secretContent" hidden></div>
  </div>
</div>

<button class="totop" id="totop" type="button" aria-label="Back to top" data-i18n-aria="totop">↑</button>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/memories.js"></script>
<script src="js/love.js"></script>
<script src="js/quiz.js"></script>
<script src="js/someday.js"></script>
<script src="js/letter.js"></script>
<script src="js/secret.js"></script>
<script src="js/extras.js"></script>
<script src="js/main.js"></script>
</body>
</html>
